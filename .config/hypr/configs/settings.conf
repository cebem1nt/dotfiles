# https://wiki.hyprland.org/Configuring/Variables/#sections

general { 
    col.active_border = rgb(787c99)
    col.inactive_border = rgba(0a0a0ddb)
    gaps_in = 2
    gaps_out = 5
    border_size = 0
    layout = scrolling
    no_focus_fallback = true

    snap {
        enabled = true
        window_gap = 15
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
    special_scale_factor = 0.95
}

master {
    new_on_top = true
    new_status = master
    special_scale_factor = 0.95
}

scrolling {
    explicit_column_widths = 0.5, 0.6, 1.0
    follow_min_visible = 1
    column_width = 0.6
    # focus_fit_method = 0
}

group {
    col.border_active = 0x00000000
    col.border_inactive = 0x00000000

    groupbar {
        font_weight_active = bold
        font_weight_inactive = bold
        gradients = true
        font_size = 14
        height = 24
        gradient_rounding = 10
        text_color = rgb(acb0d0)
        col.active =0xE6080B00
        col.inactive =0xB3080B00
        indicator_height = 0
        indicator_gap = 2
        keep_upper_gap = false
    }
}

decoration {
    rounding = 15
    # dim_inactive = true
    # dim_strength = 0.2

    blur {
        enabled = false
        passes = 1
    }
    
    shadow {
        enabled = false 
    }
}

input {
    follow_mouse = 1
    sensitivity = -0.2 
    numlock_by_default = true
    focus_on_close = 0
    
    touchpad {
        natural_scroll = true
        disable_while_typing = false
        clickfinger_behavior = true
	    scroll_factor = 0.2
    }
    
}

cursor {
    hide_on_touch = true
    enable_hyprcursor = false
    inactive_timeout = 10
    no_hardware_cursors = 0 
}

misc {
    force_default_wallpaper = 0
    disable_autoreload = true
    disable_hyprland_logo = true
    enable_anr_dialog = false
    focus_on_activate = true
    on_focus_under_fullscreen = 1
    vrr = 2
}                                 

xwayland {
    enabled = true
    force_zero_scaling = true
}

binds {
    workspace_back_and_forth = true
    hide_special_on_workspace_change = true
    movefocus_cycles_fullscreen = true
}

render {
    # direct_scanout = true
    cm_enabled = true
    send_content_type = false
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

gestures {
    workspace_swipe_distance = 1000
    workspace_swipe_min_speed_to_force = 1000
    workspace_swipe_direction_lock = false
    workspace_swipe_create_new = false
    workspace_swipe_cancel_ratio = 0.1
}

gesture = 3, vertical, workspace
gesture = 3, left, dispatcher, layoutmsg, focus r
gesture = 3, right, dispatcher, layoutmsg, focus l

