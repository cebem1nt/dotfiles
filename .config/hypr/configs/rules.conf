#  ▀▀▀▀ ▀▪▀▀▀▀▀ █▪▀▀▀▀▀•  ▀▀▀▀ ▀▪    .▀  ▀ ▀▀▀ .▀▀▀  ▀▀▀  ▀▀▀▀ 

# https://wiki.hyprland.org/Configuring/Window-Rules/

windowrule = float on, match:title ^(Font Manager)$
windowrule = float on, match:title ^(DevToolsApp)$
windowrule = float on, match:title ^(Volume Control)$
windowrule = float on, match:title ^(Qalculate!)$
windowrule = float on, match:class blueman-manager
windowrule = float on, match:class blueman-services
windowrule = float on, match:class nwg-look
windowrule = float on, match:class rog-control-center
windowrule = float on, match:class org.qbittorrent.qBittorrent
windowrule = float on, match:class kvantummanager
windowrule = float on, match:class xfce-polkit
windowrule = float on, match:class org.polymc.PolyMC
windowrule = float on, match:class engrampa
windowrule = float on, match:class nm-connection-editor
windowrule = float on, match:class spotify
windowrule = float on, match:class Notion
windowrule = float on, match:class system-config-printer
windowrule = float on, match:class net.lutris.Lutris
windowrule = float on, match:class org.bleachbit.BleachBit
windowrule = float on, match:class vlc
windowrule = float on, match:class exo-desktop-item-edit
windowrule = float on, match:class xdg-desktop-portal-gtk
windowrule = float on, match:class flameshot
windowrule = float on, match:class org.gnome.eog
windowrule = float on, match:class qt6ct
windowrule = float on, match:class org.gnome.seahorse.Application

# Arduino ide file manager menu (native wayland)
windowrule = float on,match:class electron,match:title (^$)
windowrule = float on,match:class electron,match:title (Save sketch folder as...)

# Winetricks
windowrule = float on, match:class zenity, match:title ^(Winetricks -)(.*)
windowrule = float on, match:class zenity, match:title winetricks

# Telegram
# windowrule = fullscreen on, match:class org.telegram.desktop
windowrule = float on,match:class org.telegram.desktop,match:title ^(Media viewer)

# Stayfocused
windowrule = stay_focused on, match:class xfce-polkit
windowrule = stay_focused on, match:title ^(Rename device)$, match:class blueman-manager
# windowrule=stay_focused on,match:title ^(Open Workspace from File)$,match:class codium
# windowrule=stay_focused on,match:title ^(Open Folder)$,match:class codium
# windowrule=stay_focused on,match:title ^(Open File)$,match:class codium
# windowrule=stay_focused on,match:title ^(Add Folder to Workspace)$,match:class codium

# Thunar
windowrule = float on,          match:title ^(File Operation Progress)$,    match:class thunar
windowrule = float on,          match:title ^(Rename)(.*)$,                 match:class thunar
windowrule = stay_focused on,   match:title ^Rename "[^"]+"$,               match:class thunar
windowrule = stay_focused on,   match:title ^(Create Document from)(.*)$,   match:class thunar
windowrule = stay_focused on,   match:title ^(New)(.*)(...)$,               match:class thunar
windowrule = stay_focused on,   match:title ^(Create New Folder)$,          match:class thunar
windowrule = move 1425 906,     match:title ^(File Operation Progress)$,    match:class thunar # Moves thunar progress message to the right bottom
windowrule = move 662  443,     match:title ^(Attention)$,                  match:class thunar # Moves thunar "Attention" dialogue to center 

windowrule = size 1000 500,     match:class rog-control-center
windowrule = size 1340 750,     match:title ^(Lutris)$,match:class net.lutris.Lutris
windowrule = size 900 600,      match:title ^(DevToolsApp)$
windowrule = size 900 500,      match:class org.gnome.seahorse.Application
windowrule = size 900 600,      match:class org.polymc.PolyMC
windowrule = size 900 500,      match:class nwg-look

windowrule=move 50%  15%, match:title ^(DevToolsApp)$

# Alacritty
windowrule = opacity 0.9 0.8,       match:class Alacritty
windowrule = border_size 2 override, match:class Alacritty

# Zen
windowrule = float on,               match:title Library,            match:class ^(zen)(.*)$
windowrule = size 390 220,           match:title Picture-in-Picture, match:class ^(zen)(.*)$
windowrule = move 79% 6%,            match:title Picture-in-Picture, match:class ^(zen)(.*)$
windowrule = float on,               match:title Picture-in-Picture, match:class ^(zen)(.*)$
windowrule = no_initial_focus on,    match:title Picture-in-Picture, match:class ^(zen)(.*)$
windowrule = pin on,                 match:title Picture-in-Picture, match:class ^(zen)(.*)$
windowrule = border_size 2 override, match:title Picture-in-Picture, match:class ^(zen)(.*)$

# Games
windowrule = fullscreen on, match:title ^(Forza Horizon 4), match:class ^(steam_app_)(.*)$
windowrule = fullscreen on, match:title ^(Geometry Dash),   match:class ^(steam_app_)(.*)$
windowrule = fullscreen on, match:title ^(House Flipper 2), match:class ^(steam_app_)(.*)$

# Tags
windowrule = float on,               match:tag  float
windowrule = opacity 1 override,     match:tag  opaque
windowrule = border_size 2 override, match:tag  bordered

# Misc
windowrule = no_anim on,         match:class flameshot
windowrule = persistent_size on, match:class io.missioncenter.MissionCenter
windowrule = persistent_size on, match:class qt6ct
windowrule = persistent_size on, match:class Notion
windowrule = persistent_size on, match:class spotify

# Layers
layerrule = animation slide right, match:namespace swaync-control-center
layerrule = animation slide,       match:namespace rofi

layerrule = no_anim on, match:namespace swww-daemon
layerrule = no_anim on, match:namespace selection
