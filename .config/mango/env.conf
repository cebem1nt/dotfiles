#    ▄▄▄█████ █▄▄       ▒▒▒▒▒    ▄    ▄   
#  ▄▄███████▓ ███▄▄     ▒▓▓▓▓  ▄▄█    █▄▄ 
# ▄███▀▀▀███▒ █████▄▄   ▒████ ▄███    ███▄
# ▓▓▓▓▀  ███░ ████████▄  ▓▓▓▓ ▓▓▓▓    ▓▓▓▓
# ▓▓▓▓   █▀▀  ▓▓▓▓ ▀███▄▄████ ▓▓▓▓    ▓▓▓▓
# ████▄▄▄     ▓▓▓▓   ▀███████ ████    ▒▒▒▒
# ██████▀ ▓▓▓ ████     ▀▀████ ████▌  ▐░░░░
# ████▀   ███ ████       ▀███ ▐████▄ ████▌
# ▀▀█████████ ███▄         ▀▀  ▀██▒░████▀ 
#   ▀▀▀▄█████ ▀▀▀                ▀▀██▀▀   
# 
# https://mangowm.github.io/docs/configuration/basics

env = EDITOR, nvim
env = TERMINAL, alacritty
env = BROWSER, zen
env = SCRIPTS, ~/.local/bin

# Wayland realted variables
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
env = DESKTOP_SESSION, Mango
env = XCURSOR_THEME, Bibata-Modern-Ice
env = XDG_SESSION_TYPE, wayland

# Vulkan and nvidia related things
env = VKD3D_FILTER_DEVICE_NAME, NVIDIA
env = VK_ICD_FILENAMES, /usr/share/vulkan/icd.d/nvidia_icd.json

# User queue suppor for amd mesa dirvers.
# https://www.phoronix.com/news/Mesa-25.0-AMDGPU-User-Queue
env = AMD_USERQ, 1

# GTK4 apps use discrete gpu, this fixes it
# I've put the same into /etc/environment 
env = GSK_RENDERER, opengl

# Nvidia cache related variables
env = __GL_SHADER_DISK_CACHE, 1
env = __GL_SHADER_DISK_CACHE_PATH, ~/.cache/nv
env = __GL_SHADER_DISK_CACHE_SKIP_CLEANUP, 1

# Qt related environment variables
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1

# Global XDG environment variables 
env = XDG_STATE_HOME,                ~/.local/state
env = XDG_DATA_HOME,                 ~/.local/share
env = XDG_CONFIG_HOME,               ~/.config
env = XDG_CACHE_HOME,                ~/.cache

env = XDG_DESKTOP_DIR,               ~/wsp
env = XDG_DOWNLOAD_DIR,              ~/dow
env = XDG_DOCUMENTS_DIR,             ~/doc
env = XDG_PUBLICSHARE_DIR,           ~/wsp/public
env = XDG_MUSIC_DIR,                 ~/med/music
env = XDG_PICTURES_DIR,              ~/med/pictures
env = XDG_VIDEOS_DIR,                ~/med/videos
env = XDG_TEMPLATES_DIR,             ~/.local/share/templates

# Force misc apps use XDG base directories
env = GNUPGHOME,                     ~/.local/share/gnupg
env = MYSQL_HISTFILE,                ~/.local/share/mysql/history
env = CARGO_HOME,                    ~/.local/share/rust-cargo
env = CUDA_CACHE_PATH,               ~/.cache/cuda
env = NPM_CONFIG_USERCONFIG,         ~/.config/npm/npmrc
env = WGETRC,                        ~/.config/wgetrc
env = DOCKER_CONFIG,                 ~/.config/docker
env = KEEPER_STORAGE_DIR,            ~/.local/state/keeper_storage
env = GOPATH,                        ~/.local/share/go
env = GOMODCACHE,                    ~/.cache/go/mod
env = PYTHON_HISTORY,                ~/.local/state/python_history

env = _JAVA_OPTIONS, -Djava.util.prefs.userRoot=~/.config/java
env = GTK2_RC_FILES, ~/.config/gtk-2.0/gtkrc:~/.config/gtk-2.0/gtkrc.mine
