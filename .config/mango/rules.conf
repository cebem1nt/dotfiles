# ░███  ▀▓▓▓▓ ▓▓▓▓    ▓▓▓▓ ▓▓▓▓        ▓▓▓▓▀  ███░  ▀████▄ ▓▓▓▓ 
# ████   ▓▓▀▀ ▓▓▓▓    ▓▓▓▓ ▓▓▓▓        ▓▓▓▓   █▀▀    ▀▀███▄     
# ▀▀▀▀▐████▄  ████    ▒▒▒▒ ████        ████▄▄▄     ▒▒▒ ▀████▄   
# ▓▓▓▓  ▀███▄ ████    ░░░░ ████    ▓▓▓ ██████▀ ▓▓▓ ▓▓▓   ▀ ██▄▄ 
# ████   ████ ████▄  ▄████ ████▄   ███ ████▀   ███    ▄    █████
# ▄███   ██▀▀ ▀▀██▒░█████▀ ▀▀█████████ ▀▀█████████ █  ▄▄▄▄▄█████
#  ▀▄█   ▀▀     ▀▀▀▄▄▀▀▀     ▀▀▀▄█████   ▀▀▀▄█████  ▀ ███████▀▀ 
#                                                      ▀▀▀▀▀▀   
# https://mangowm.github.io/docs/window-management/rules


# layouts:
#    tile, scroller, grid, deck, monocle,
#    center_tile, vertical_tile, vertical_scroller

tagrule = id:*, layout_name:scroller

# tagrule = id:*, no_render_border:1

windowrule = appid:Alacritty, focused_opacity:0.9, unfocused_opacity:0.8, isnoborder:0
windowrule = appid:flameshot, animation_type_open:none, animation_type_close:none, isfloating:1
windowrule = appid:ueberzugpp(.*), isfloating:1
windowrule = appid:(s|S)potify, isfloating:1, width:1850, height:1000
windowrule = appid:^(zen)(.*)$, title:Picture-in-Picture, width:350, height:200, offsetx:100, offsety:-100, isglobal:1, isfloating:1, isopensilent:1

# Alacritty clock
windowrule = appid:peaclock, isfloating:1, isglobal:1, width:500, height:260, offsetx:0, offsety:-100

windowrule = appid:codium|vesktop|zen, scroller_proportion:1.0
windowrule = appid:Alacritty, scroller_proportion:0.5

# Make these apps small
windowrule = appid:org.gnome.seahorse.Application, width:900, height:600
windowrule = appid:org.polymc.PolyMC,              width:900, height:600
windowrule = appid:nwg-look,                       width:900, height:600

# Thunat things
windowrule = appid:(t|T)hunar, title:^(File Operation Progress)$, offsetx:0, offsety:100, isopensilent:1
windowrule = appid:(t|T)hunar, title:Rename "*.*"|File Operation Progress|Confirm to replace files|Attention, isfloating:1
windowrule = appid:(t|T)hunar, scroller_proportion:0.5

# Floating windows by appid
windowrule = appid:blueman-manager,                isfloating:1
windowrule = appid:blueman-services,               isfloating:1
windowrule = appid:nwg-look,                       isfloating:1
windowrule = appid:rog-control-center,             isfloating:1
windowrule = appid:org.qbittorrent.qBittorrent,    isfloating:1
windowrule = appid:kvantummanager,                 isfloating:1
windowrule = appid:org.gnome.seahorse.Application, isfloating:1
windowrule = appid:xfce-polkit,                    isfloating:1
windowrule = appid:org.polymc.PolyMC,              isfloating:1
windowrule = appid:engrampa,                       isfloating:1
windowrule = appid:nm-connection-editor,           isfloating:1
windowrule = appid:system-config-printer,          isfloating:1
windowrule = appid:hyprland-share-picker,          isfloating:1
windowrule = appid:org.bleachbit.BleachBit,        isfloating:1
windowrule = appid:vlc,                            isfloating:1
windowrule = appid:exo-desktop-item-edit,          isfloating:1
windowrule = appid:xdg-desktop-portal-gtk,         isfloating:1
windowrule = appid:org.gnome.eog,                  isfloating:1
windowrule = appid:qt6ct,                          isfloating:1

# Float by title
windowrule = title:Font Manager,                   isfloating:1
windowrule = title:Volume Control,                 isfloating:1
windowrule = title:Qalculate!,                     isfloating:1
windowrule = title:Library,                        isfloating:1
windowrule = title:Add bookmark,                   isfloating:1

devicerule = name:ASUF1204:00 2808:0104 Touchpad, accel_speed: -0.1
devicerule = name:ASUF1204:00 2808:0104 Touchpad, middle_button_emulation: 0

layerrule = layer_name:selection, animation_type_open:none, animation_type_close:none

