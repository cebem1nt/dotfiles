# ░███  ▀▓▓▓▓ ▓▓▓▓    ▓▓▓▓ ▓▓▓▓        ▓▓▓▓▀  ███░  ▀████▄ ▓▓▓▓ 
# ████   ▓▓▀▀ ▓▓▓▓    ▓▓▓▓ ▓▓▓▓        ▓▓▓▓   █▀▀    ▀▀███▄     
# ▀▀▀▀▐████▄  ████    ▒▒▒▒ ████        ████▄▄▄     ▒▒▒ ▀████▄   
# ▓▓▓▓  ▀███▄ ████    ░░░░ ████    ▓▓▓ ██████▀ ▓▓▓ ▓▓▓   ▀ ██▄▄ 
# ████   ████ ████▄  ▄████ ████▄   ███ ████▀   ███    ▄    █████
# ▄███   ██▀▀ ▀▀██▒░█████▀ ▀▀█████████ ▀▀█████████ █  ▄▄▄▄▄█████
#  ▀▄█   ▀▀     ▀▀▀▄▄▀▀▀     ▀▀▀▄█████   ▀▀▀▄█████  ▀ ███████▀▀ 
#                                                      ▀▀▀▀▀▀   
# https://mangowm.github.io/docs/window-management/rules


# layouts:
#    tile, scroller, grid, deck, monocle,
#    center_tile, vertical_tile, vertical_scroller

tag_rule = id:*, layout_name:scroller

window_rule = app_id:(.*), no_border:1

# Alacritty
window_rule = app_id:^Alacritty.*$, focused_opacity:0.9, unfocused_opacity:0.8, no_border:0
window_rule = app_id:^Alacritty.*$, scroller_proportion:0.5
window_rule = app_id:^Alacritty-Floating.*$, width:1000, height:700, is_floating:1 # Floating
window_rule = app_id:Alacritty-Floating-Peaclock, width:500, height:260, is_global:1, offset_x:0, offset_y:-100 # Clock

window_rule = app_id:flameshot, animation_type_open:none, animation_type_close:none, is_overlay:1, is_floating:1
window_rule = app_id:ueberzugpp(.*), is_floating:1
window_rule = app_id:(s|S)potify, is_floating:1, width:1850, height:1000, tags:5

# Picture in picture window 
window_rule = app_id:^(zen)(.*)$, title:Picture-in-Picture, width:350, height:200, offset_x:100, offset_y:-100, is_global:1, is_floating:1, is_open_silent:1, is_overlay:1

# These should have a full scrolller witdh
window_rule = app_id:codium|vesktop|zen, scroller_proportion:1.0

# gtk filepicker should appear above fullscreen windows
window_rule = app_id:xdg-desktop-portal-gtk, is_floating:1, is_overlay:1

# Make these apps small
window_rule = app_id:org.gnome.seahorse.Application, width:900, height:600
window_rule = app_id:org.polymc.PolyMC,              width:900, height:600
window_rule = app_id:nwg-look,                       width:900, height:600

# Thunat things
window_rule = app_id:(t|T)hunar, title:^(File Operation Progress)$, offset_x:100, offset_y:80, width:500, is_open_silent:1
window_rule = app_id:(t|T)hunar, title:Rename "*.*"|File Operation Progress|Confirm to replace files|Attention, is_floating:1
window_rule = app_id:(t|T)hunar, scroller_proportion:0.5
window_rule = app_id:(t|T)hunar, no_border:0

# Floating windows by app_id
window_rule = app_id:blueman-manager,                is_floating:1
window_rule = app_id:blueman-services,               is_floating:1
window_rule = app_id:nwg-look,                       is_floating:1
window_rule = app_id:rog-control-center,             is_floating:1
window_rule = app_id:org.qbittorrent.qBittorrent,    is_floating:1
window_rule = app_id:kvantummanager,                 is_floating:1
window_rule = app_id:org.gnome.seahorse.Application, is_floating:1
window_rule = app_id:xfce-polkit,                    is_floating:1
window_rule = app_id:org.polymc.PolyMC,              is_floating:1
window_rule = app_id:engrampa,                       is_floating:1
window_rule = app_id:nm-connection-editor,           is_floating:1
window_rule = app_id:system-config-printer,          is_floating:1
window_rule = app_id:hyprland-share-picker,          is_floating:1
window_rule = app_id:org.bleachbit.BleachBit,        is_floating:1
window_rule = app_id:vlc,                            is_floating:1
window_rule = app_id:exo-desktop-item-edit,          is_floating:1
window_rule = app_id:org.gnome.eog,                  is_floating:1
window_rule = app_id:qt6ct,                          is_floating:1

# Float by title
window_rule = title:Font Manager,                   is_floating:1
window_rule = title:Volume Control,                 is_floating:1
window_rule = title:Qalculate!,                     is_floating:1
window_rule = title:Library,                        is_floating:1
window_rule = title:Add bookmark,                   is_floating:1

window_rule = title:^(DevTools)(.*)$, app_id:Chromium-browser, is_floating:1 
window_rule = title:(Media viewer), app_id:com.ayugram.desktop, is_floating:1, is_fullscreen:1 

layer_rule = layer_name:selection, animation_type_open:none, animation_type_close:none

device_rule = name:ASUF1204:00 2808:0104 Touchpad, accel_speed: -0.1

