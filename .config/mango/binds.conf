# https://mangowm.github.io/docs/bindings/keys

bind = SUPER, SEMICOLON, spawn, alacritty

bind = SUPER, b, spawn, thunar
bind = SUPER, n, spawn, zen
bind = SUPER, m, spawn, vscodium

bind = SUPER, Tab, toggleoverview,
bind = SUPER, o, togglejump,

# Menus
bind = SUPER, r,         spawn, ~/.local/bin/toggle_rofi ~/.config/rofi/bin/drun
bind = SUPER, v,         spawn, ~/.local/bin/toggle_rofi ~/.config/rofi/bin/clipboard
bind = SUPER, e,         spawn, ~/.local/bin/toggle_rofi ~/.config/rofi/bin/filebrowser
bind = SUPER, ESCAPE,    spawn, ~/.local/bin/toggle_rofi ~/.config/rofi/bin/logout
bind = SUPER + SHIFT, r, spawn, ~/.local/bin/toggle_rofi ~/.config/rofi/bin/run
bind = SUPER + SHIFT, v, spawn, ~/.local/bin/toggle_rofi ~/.config/rofi/bin/icons
bind = SUPER, y,         spawn, ~/.local/bin/toggle_rofi ~/.local/bin/auto_walls rofi

bind = SUPER, t, spawn, swaync-client -t
bind = SUPER + CTRL, r, reload_config

bind = SUPER, q, killclient
bind = SUPER + SHIFT, q, killclient, force

bind = SUPER,         u, toggleglobal
bind = SUPER,         z, resizewin, -80, -75
bind = SUPER,         c, resizewin, +80, +75
bind = SUPER,         a, exchange_client, left
bind = SUPER,         d, exchange_client, right
bind = SUPER,         f, togglefloating
bind = SUPER + SHIFT, f, togglefullscreen

bindc = SUPER,         w, centerwin
bindc = SUPER,         w, switch_proportion_preset, next
bind  = SUPER + SHIFT, w, switch_proportion_preset, prev

bind = SUPER + SHIFT, space,        spawn_shell, killall waybar ; waybar &
bind = SUPER + SHIFT, y,            spawn, ~/.local/bin/themesw
bind = SUPER, minus,                spawn, ~/.local/bin/volume -2
bind = SUPER, equal,                spawn, ~/.local/bin/volume +2

bind = SUPER, space,                spawn, pkill -SIGRTMIN+1 -f dock-mango
bind = SUPER, period,               spawn, playerctl next
bind = SUPER, comma,                spawn, playerctl previous
bind = SUPER, slash,                spawn, playerctl play-pause
bind = SUPER + SHIFT, slash,        spawn, ~/.local/bin/auto_walls toggle
bind = SUPER + SHIFT, period,       spawn, ~/.local/bin/auto_walls next
bind = SUPER + SHIFT, comma,        spawn, ~/.local/bin/auto_walls prev

bind = NONE,  Print,                spawn, ~/.local/bin/screenshot
bind = SHIFT, Print,                spawn, ~/.local/bin/screenshot --select
bind = CTRL, Print,                 spawn, ~/.local/bin/screenrec
bind = CTRL + SHIFT, Print,         spawn, ~/.local/bin/screenrec --select

bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0

bind = SUPER + SHIFT, 1, tag, 1, 0
bind = SUPER + SHIFT, 2, tag, 2, 0
bind = SUPER + SHIFT, 3, tag, 3, 0
bind = SUPER + SHIFT, 4, tag, 4, 0
bind = SUPER + SHIFT, 5, tag, 5, 0

bind = SUPER + CTRL, 1, tagsilent, 1
bind = SUPER + CTRL, 2, tagsilent, 2
bind = SUPER + CTRL, 3, tagsilent, 3
bind = SUPER + CTRL, 4, tagsilent, 4
bind = SUPER + CTRL, 5, tagsilent, 5

bind = SUPER, s, toggle_scratchpad
bind = SUPER + SHIFT, s, minimized
bind = SUPER + CTRL, s, restore_minimized


bind = SUPER + CTRL, Up,    scroller_stack, up
bind = SUPER + CTRL, Down,  scroller_stack, down
bind = SUPER + CTRL, Left,  scroller_stack, left
bind = SUPER + CTRL, Right, scroller_stack, right

# swap window
bind = SUPER + SHIFT, Up,    exchange_client, up
bind = SUPER + SHIFT, Down,  exchange_client, down
bind = SUPER + SHIFT, Left,  exchange_client, left
bind = SUPER + SHIFT, Right, exchange_client, right

bind = SUPER + SHIFT + CTRL, Up,    resizewin,  +0, -50
bind = SUPER + SHIFT + CTRL, Down,  resizewin,  +0, +50
bind = SUPER + SHIFT + CTRL, Left,  resizewin, -50, +0
bind = SUPER + SHIFT + CTRL, Right, resizewin, +50, +0

# switch window focus
bind = SUPER, Up,    focus_window_or_workspace, up
bind = SUPER, Down,  focus_window_or_workspace, down
bind = SUPER, Left,  focusdir, left
bind = SUPER, Right, focusdir, right

# Mouse Button Bindings
mousebind = SUPER, btn_left,  moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize

# Axis Bindings
# axisbind = SUPER, UP,    viewtoleft_have_client
# axisbind = SUPER, DOWN,  viewtoright_have_client
# axisbind = SUPER, LEFT,  focusdir, left
# axisbind = SUPER, RIGHT, focusdir, right

bindl = NONE, XF86AudioNext,        spawn, playerctl next
bindl = NONE, XF86AudioPause,       spawn, playerctl pause
bindl = NONE, XF86AudioPlay,        spawn, playerctl play-pause
bindl = NONE, XF86KbdBrightnessUp,  spawn, asusctl leds next
bindl = NONE, XF86KbdBrightnessDown,spawn, asusctl leds prev
bindl = NONE, Pause,                spawn, playerctl pause
bindl = NONE, XF86AudioMute,        spawn, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = NONE, XF86AudioPrev,        spawn, playerctl previous
bindl = NONE, XF86AudioMicMute,     spawn, ~/.local/bin/mictoggle
bindl = NONE, XF86AudioRaiseVolume, spawn, ~/.local/bin/volume +5
bindl = NONE, XF86AudioLowerVolume, spawn, ~/.local/bin/volume -5
bindl = NONE, XF86MonBrightnessUp,  spawn, ~/.local/bin/brightness 5%+
bindl = NONE, XF86MonBrightnessDown,spawn, ~/.local/bin/brightness 5%-

bind = NONE, XF86Launch1,           spawn, ~/.local/bin/powerprofile next
bind = NONE, XF86Calculator,        spawn, qalculate-gtk
bind = NONE, XF86Launch4,           spawn, rog-control-center
bind = NONE, XF86PowerOff,          spawn, ~/.config/rofi/bin/logout --shutdown

gesturebind = NONE, UP, 3,    viewtoright_have_client
gesturebind = NONE, DOWN, 3,  viewtoleft_have_client
gesturebind = NONE, LEFT, 3,  focusdir, right
gesturebind = NONE, RIGHT, 3, focusdir, left
