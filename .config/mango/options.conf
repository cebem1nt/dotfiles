# Gaps
gappih = 5
gappiv = 5
gappoh = 5
gappov = 5

borderpx = 2

scratchpad_width_ratio = 0.9
scratchpad_height_ratio = 0.9

# Window effect
border_radius           = 15   # Windows border radius
no_radius_when_single   = 0    # Do not apply radius when only window
focused_opacity         = 1.0  # Focused window opacity
unfocused_opacity       = 1.0  # Unfocused window opacity

blur                    = 0    # Enable blur for windows.
blur_layer              = 0    # Enable blur for layers.
blur_optimized          = 1    # Some optimization for blur, wallpaper related
blur_params_num_passes  = 2    # Amount of blur passes
blur_params_radius      = 5
blur_params_noise       = 0.02
blur_params_brightness  = 0.9
blur_params_contrast    = 0.9  
blur_params_saturation  = 1.2

shadows                 = 0    # Enable shadows for windows
layer_shadows           = 0    # Enable shadows for layeres
shadow_only_floating    = 1    # Shadow only floating windows
shadows_size            = 10   
shadows_blur            = 15
shadows_position_x      = 0
shadows_position_y      = 0
shadowscolor            = 0x000000ff

# Scroller Layout

scroller_proportion_preset         = 0.5, 0.6, 0.8, 0.9, 1.0
scroller_structs                   = 5    # Width (gaps) reserved on sides when window ratio is 1.
scroller_default_proportion        = 0.9  # Default window proportion 
scroller_default_proportion_single = 1.0  # Default window proportion when single
scroller_focus_center              = 0    # Always center focused window
scroller_prefer_center             = 0    # Center focused window only if it was outside the view.
scroller_prefer_overspread         = 1    # Allow windows to overspread when there's extra space.
edge_scroller_pointer_focus        = 1    # Focus windows even if partially off-screen.
edge_scroller_focus_allow_speed    = 80   # Allow pointer focus to happen if the pointer moves at a speed greater
scroller_ignore_proportion_single  = 0    # Ignore proportion adjustments for single windows.

# Master-Stack Layout Setting
new_is_master   = 1
default_mfact   = 0.55
default_nmaster = 1
tag_num         = 5
smartgaps       = 0

# Dwindle Layout Setting
dwindle_smart_split       = 0
dwindle_drop_simple_split = 1
dwindle_manual_split      = 0
dwindle_hsplit            = 1
dwindle_vsplit            = 1
dwindle_preserve_split    = 0

# Overview Setting
enable_hotarea  = 0
hotarea_size    = 10
ov_tab_mode     = 1
overviewgappi   = 5
overviewgappo   = 30

# Misc
no_border_when_single      = 1
axis_bind_apply_timeout    = 100
focus_on_activate          = 1
idleinhibit_ignore_visible = 0
sloppyfocus                = 1 # Focus on mouse hover
warpcursor                 = 1 # Move mouse to center when focusing window
focus_cross_monitor        = 0
focus_cross_tag            = 0
enable_floating_snap       = 0
snap_distance              = 30
cursor_size                = 24
cursor_hide_timeout        = 10 # hide cursor after N seconds
drag_tile_to_tile          = 1  # Enable drag & tile
drag_tile_small            = 0  # Make window smaller when dragging

# keyboard
repeat_rate      = 25
repeat_delay     = 600
numlockon        = 1
xkb_rules_layout = us

# Trackpad
# need relogin to make it apply
disable_trackpad                 = 0
tap_to_click                     = 1   # left click/right click for taps
tap_and_drag                     = 1   # drag things on tap and hold
drag_lock                        = 0
trackpad_natural_scrolling       = 1
trackpad_left_handed             = 0
trackpad_middle_button_emulation = 0
trackpad_disable_while_typing    = 0
swipe_min_threshold              = 0.9 # Swipe distance to exec gesture 1 -> full distance

# mouse
# need relogin to make it apply
mouse_natural_scrolling = 0
mouse_middle_button_emulation = 0

xwayland_persistence = 0